<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="stylesheet" href="style.css">
  <title></title>
</head>

<body>
  <header>
    <section class="profile">
      <section class="status">
        <section class="avatar"></section>
        <p>LVL. <span id="player-level">1</span></p>
      </section>
      <section class="resources">
        <section class="gold">
          <p>G</p><span id="gold">0</span>
        </section>
        <section class="elixir">
          <p>E</p><span id="elixir">0</span>
        </section>
        <section class="xp-bar"><span></span></section>
      </section>
    </section>
  </header>

  <main>
    <section class="enemies">
      <section class="">
        <input type="text" placeholder="search enemy..." id="search">
      </section>
    </section>
  </main>

  <footer>
    <button class="back">BUTTON</button>
  </footer>

  <script src="script.js"></script>
</body>

</html>
